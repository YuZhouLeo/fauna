name: 每日更新成交量與收盤價

on:
  schedule:
    # cron 是 UTC。台北 = UTC+8。
    # 台股 13:30 收盤，證交所／櫃買的收盤行情約 14:00–14:30 才發布，排 17:00 一定拿得到。
    - cron: '0 9 * * 1-5'    # 台北 週一~週五 17:00
    - cron: '0 10 * * 1-5'   # 台北 18:00 補跑一次（前一輪若遇上 Actions 排隊）
  workflow_dispatch:          # 也可以到 Actions 分頁手動按

# 同一時間只跑一個，避免兩輪撞在一起互相蓋掉
concurrency:
  group: update-quotes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓行情並改寫 index.html
        run: python scripts/update_quotes.py

      - name: 有變動才 commit
        run: |
          # 用 status --porcelain 而不是 diff --quiet：新增的 data/volume/*.json
          # 是未追蹤檔案，diff 看不到，會害當天的成交量歷史被丟掉。
          if [ -z "$(git status --porcelain)" ]; then
            echo "沒有變動（今天休市，或資料與上一輪相同）——跳過 commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/
          git commit -m "chore: 更新成交量與收盤價 $(TZ=Asia/Taipei date '+%Y-%m-%d')"
          git push
