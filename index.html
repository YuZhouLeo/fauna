<title>台股翻牌練習</title>
<style>
  :root {
    --ground: #ECEEEA;
    --surface: #FFFFFF;
    --surface-2: #F6F7F5;
    --ink: #1F2422;
    --ink-2: #6B7370;
    --line: #D8DCD6;
    --up: #C2453E;      /* 台股紅＝漲＝認得 */
    --up-ink: #FFFFFF;
    --down: #1E7A5A;    /* 台股綠＝跌＝不熟 */
    --down-ink: #FFFFFF;
    --accent: #C2453E;
    --chip-on: #2A2F2D;
    --chip-on-ink: #F2F3F0;
    --shadow: 0 10px 30px rgba(31, 36, 34, .10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #14171A;
      --surface: #1E2226;
      --surface-2: #262B30;
      --ink: #E8E6E1;
      --ink-2: #8B9299;
      --line: #343A40;
      --up: #E05C54;
      --up-ink: #1A0F0E;
      --down: #34A57E;
      --down-ink: #0C1712;
      --accent: #E05C54;
      --chip-on: #E8E6E1;
      --chip-on-ink: #14171A;
      --shadow: 0 10px 30px rgba(0, 0, 0, .45);
    }
  }
  :root[data-theme="light"] {
    --ground: #ECEEEA; --surface: #FFFFFF; --surface-2: #F6F7F5;
    --ink: #1F2422; --ink-2: #6B7370; --line: #D8DCD6;
    --up: #C2453E; --up-ink: #FFFFFF; --down: #1E7A5A; --down-ink: #FFFFFF;
    --accent: #C2453E; --chip-on: #2A2F2D; --chip-on-ink: #F2F3F0;
    --shadow: 0 10px 30px rgba(31, 36, 34, .10);
  }
  :root[data-theme="dark"] {
    --ground: #14171A; --surface: #1E2226; --surface-2: #262B30;
    --ink: #E8E6E1; --ink-2: #8B9299; --line: #343A40;
    --up: #E05C54; --up-ink: #1A0F0E; --down: #34A57E; --down-ink: #0C1712;
    --accent: #E05C54; --chip-on: #E8E6E1; --chip-on-ink: #14171A;
    --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  .mono {
    font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .screen {
    min-height: 100dvh;
    display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 20px calc(env(safe-area-inset-bottom, 0px) + 20px);
    max-width: 560px; margin: 0 auto;
  }

  /* ---------- 設定畫面 ---------- */
  .brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .brand h1 { font-size: 26px; font-weight: 800; letter-spacing: .02em; }
  .brand .tick { color: var(--accent); }
  .datestamp { font-size: 11px; color: var(--ink-2); text-align: right; line-height: 1.5; }

  .field { margin-top: 22px; }
  .field > label {
    display: block; font-size: 12px; font-weight: 700; color: var(--ink-2);
    letter-spacing: .14em; text-transform: uppercase; margin-bottom: 10px;
  }
  .modes { display: flex; flex-direction: column; gap: 8px; }
  .mode-btn {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; text-align: left; font-size: 16px; font-weight: 600;
  }
  .mode-btn small { font-size: 12px; font-weight: 500; color: var(--ink-2); }
  .mode-btn[aria-pressed="true"] {
    border-color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .mode-btn[aria-pressed="true"] .radio { background: var(--accent); border-color: var(--accent); }
  .radio {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--line); flex: none; margin-left: 12px;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 14px; font-size: 14px; font-weight: 600;
  }
  .chip .cnt { font-size: 11px; color: var(--ink-2); }
  .chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
  .chip[aria-pressed="true"] .cnt { color: var(--chip-on-ink); opacity: .65; }

  .chip:disabled { opacity: .35; }
  .hint { font-size: 11.5px; color: var(--ink-2); margin-top: 9px; line-height: 1.6; }
  .hint b { color: var(--ink); font-weight: 700; }

  .start-btn {
    margin-top: auto; padding: 18px;
    background: var(--accent); color: var(--up-ink);
    border-radius: 12px; font-size: 17px; font-weight: 800; letter-spacing: .04em;
  }
  .start-btn:disabled { opacity: .4; }
  .setup-note { text-align: center; font-size: 11px; color: var(--ink-2); margin-top: 10px; }

  /* ---------- 練習畫面 ---------- */
  .play-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .quit { font-size: 14px; font-weight: 600; color: var(--ink-2); padding: 6px 2px; }
  .play-mode { font-size: 12px; color: var(--ink-2); letter-spacing: .1em; }
  .play-score { font-size: 14px; font-weight: 700; }
  .bar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 12px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }

  .stage { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .flip-wrap { perspective: 1100px; }
  .card3d {
    position: relative; width: 100%; aspect-ratio: 4 / 4.6; max-height: 52dvh;
    transform-style: preserve-3d; transition: transform .45s cubic-bezier(.3,.9,.35,1);
  }
  .card3d.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: var(--surface); border: 1px solid var(--line); border-radius: 22px;
    box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 24px; text-align: center; overflow: hidden;
  }
  .face.back { transform: rotateY(180deg); }
  @media (prefers-reduced-motion: reduce) {
    .card3d { transition: none; }
  }
  .face .tag {
    position: absolute; top: 16px; left: 16px;
    font-size: 11px; font-weight: 700; letter-spacing: .12em;
    color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px;
  }
  .face .ask {
    position: absolute; top: 16px; right: 16px;
    font-size: 11px; color: var(--ink-2); letter-spacing: .12em;
  }
  .q-code { font-size: clamp(56px, 19vw, 96px); font-weight: 700; letter-spacing: .04em; }
  .q-name { font-size: clamp(34px, 11vw, 56px); font-weight: 800; line-height: 1.2; text-wrap: balance; }
  .a-code { font-size: clamp(48px, 16vw, 80px); font-weight: 700; letter-spacing: .04em; color: var(--accent); }
  .a-name { font-size: clamp(30px, 9.5vw, 46px); font-weight: 800; line-height: 1.2; text-wrap: balance; color: var(--accent); }
  .a-desc {
    font-size: 15px; line-height: 1.6; color: var(--ink);
    max-width: 30ch; text-wrap: balance; margin-top: 2px;
  }
  .a-meta { font-size: 13px; color: var(--ink-2); line-height: 1.7; }
  .a-meta b { color: var(--ink); font-weight: 600; }
  .tap-hint { text-align: center; font-size: 12px; color: var(--ink-2); margin-top: 14px; }

  .judge { display: flex; gap: 12px; margin-top: 16px; }
  .judge button {
    flex: 1; padding: 17px 8px; border-radius: 12px;
    font-size: 17px; font-weight: 800; letter-spacing: .06em;
  }
  .judge .no { background: var(--down); color: var(--down-ink); }
  .judge .yes { background: var(--up); color: var(--up-ink); }
  .judge button:disabled { opacity: .35; }
  .judge .arrow { font-size: 13px; margin-right: 4px; }

  /* ---------- 結束畫面 ---------- */
  .done-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 24px; }
  .done-title { font-size: 24px; font-weight: 800; text-align: center; }
  .stats { display: flex; gap: 10px; }
  .stat {
    flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 8px; text-align: center;
  }
  .stat .num { font-size: 30px; font-weight: 700; }
  .stat .lbl { font-size: 11px; color: var(--ink-2); margin-top: 4px; letter-spacing: .08em; }
  .stat.up .num { color: var(--up); }
  .stat.down .num { color: var(--down); }
  .done-actions { display: flex; flex-direction: column; gap: 10px; }
  .btn-primary { padding: 16px; background: var(--accent); color: var(--up-ink); border-radius: 12px; font-size: 16px; font-weight: 800; }
  .btn-ghost { padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; font-size: 16px; font-weight: 700; }
</style>

<!-- ═══════════ 設定畫面 ═══════════ -->
<section class="screen" id="scr-setup">
  <div class="brand">
    <h1>台股翻牌<span class="tick">練習</span></h1>
    <div class="datestamp" id="datestamp"></div>
  </div>

  <div class="field">
    <label>出題模式</label>
    <div class="modes" id="modes">
      <button class="mode-btn" data-mode="c2n"><span>看代號 → 猜名稱<br><small>正面股號，翻面看公司名</small></span><span class="radio"></span></button>
      <button class="mode-btn" data-mode="n2c"><span>看名稱 → 猜代號<br><small>正面公司名，翻面看股號</small></span><span class="radio"></span></button>
      <button class="mode-btn" data-mode="mix"><span>混合出題<br><small>兩種方向隨機交錯</small></span><span class="radio"></span></button>
    </div>
  </div>

  <div class="field">
    <label>市場</label>
    <div class="chips" id="markets">
      <button class="chip" data-mkt="all">全部</button>
      <button class="chip" data-mkt="上市">上市</button>
      <button class="chip" data-mkt="上櫃">上櫃</button>
    </div>
  </div>

  <div class="field">
    <label id="th-label">成交量門檻</label>
    <div class="chips" id="thresholds"></div>
  </div>

  <div class="field">
    <label>練習範圍</label>
    <div class="chips" id="scopes">
      <button class="chip" data-scope="srs">智慧排程<span class="cnt"></span></button>
      <button class="chip" data-scope="weak">只練不熟<span class="cnt"></span></button>
      <button class="chip" data-scope="all">全部<span class="cnt"></span></button>
    </div>
    <div class="hint" id="scope-hint"></div>
  </div>

  <div class="field">
    <label>每輪張數</label>
    <div class="chips" id="sizes">
      <button class="chip" data-size="20">20</button>
      <button class="chip" data-size="50">50</button>
      <button class="chip" data-size="100">100</button>
      <button class="chip" data-size="0">不限</button>
    </div>
  </div>

  <button class="start-btn" id="start"></button>
  <div class="setup-note">練習進度存在這支手機上，下次打開還在</div>
</section>

<!-- ═══════════ 練習畫面 ═══════════ -->
<section class="screen" id="scr-play" hidden>
  <div>
    <div class="play-head">
      <button class="quit" id="quit">← 結束</button>
      <span class="play-mode" id="play-mode"></span>
      <span class="play-score mono" id="play-score"></span>
    </div>
    <div class="bar"><i id="bar-fill"></i></div>
  </div>

  <div class="stage">
    <div class="flip-wrap">
      <div class="card3d" id="card">
        <button class="face front" id="face-front" aria-label="翻面看答案"></button>
        <button class="face back" id="face-back" aria-label="翻回題目"></button>
      </div>
    </div>
    <div class="tap-hint" id="tap-hint">點卡片翻面</div>
  </div>

  <div class="judge">
    <button class="no" id="btn-no" disabled><span class="arrow">▼</span>不熟</button>
    <button class="yes" id="btn-yes" disabled><span class="arrow">▲</span>認得</button>
  </div>
</section>

<!-- ═══════════ 結束畫面 ═══════════ -->
<section class="screen" id="scr-done" hidden>
  <div class="done-wrap">
    <div class="done-title" id="done-title">本輪完成</div>
    <div class="stats">
      <div class="stat"><div class="num mono" id="st-total">0</div><div class="lbl">練習檔數</div></div>
      <div class="stat up"><div class="num mono" id="st-first">0</div><div class="lbl">一翻就認得</div></div>
      <div class="stat down"><div class="num mono" id="st-miss">0</div><div class="lbl">標記不熟</div></div>
    </div>
    <div class="hint" id="done-hint" style="text-align:center"></div>
    <div class="done-actions">
      <button class="btn-primary" id="retry-miss">重練這輪不熟的</button>
      <button class="btn-ghost" id="back-setup">回設定</button>
    </div>
  </div>
</section>

const STOCKS = PAYLOAD.stocks;
const THRESHOLDS = [500, 1000, 3000, 5000, 10000, 20000];

/* ---------- 小工具 ---------- */
const $ = id => document.getElementById(id);
const rocDate = s => {
  if (!s || s.length < 7) return "—";
  return `${Number(s.slice(0, 3)) + 1911}/${s.slice(3, 5)}/${s.slice(5, 7)}`;
};
const fmtVol = v => v >= 10000 ? (v / 10000).toFixed(1).replace(/\.0$/, "") + " 萬張" : v.toLocaleString() + " 張";
const shuffle = a => {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

/* ---------- 間隔重複排程 ----------
   每張卡記 {l:等級, d:下次到期日, n:練習次數}。答對升一級、往後排更久；
   答錯直接掉回 0 級，當天就要重來。等級對應的間隔（天）如下。          */
const INTERVALS = [0, 1, 3, 7, 16, 35, 90];
const MAX_LEVEL = INTERVALS.length - 1;

const dayNum = d => d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
const today = () => dayNum(new Date());
const daysFromNow = n => { const d = new Date(); d.setDate(d.getDate() + n); return dayNum(d); };
const daysUntil = target => {
  const s = String(target);
  const t = new Date(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8));
  const now = new Date(); now.setHours(0, 0, 0, 0);
  return Math.round((t - now) / 86400000);
};

let srs = JSON.parse(localStorage.getItem("twflip-srs") || "{}");
const persistSrs = () => localStorage.setItem("twflip-srs", JSON.stringify(srs));

/* 舊版只存了一份「不熟清單」，把它接成 0 級、今天到期，進度不會白費 */
(function migrateFromMissList() {
  if (localStorage.getItem("twflip-srs")) return;
  const old = JSON.parse(localStorage.getItem("twflip-miss") || "[]");
  if (!old.length) return;
  const t = today();
  old.forEach(c => { srs[c] = { l: 0, d: t, n: 0 }; });
  persistSrs();
})();

function grade(code, ok) {
  const r = srs[code] || { l: 0, d: 0, n: 0 };
  r.n = (r.n || 0) + 1;
  r.l = ok ? Math.min(r.l + 1, MAX_LEVEL) : 0;
  r.d = daysFromNow(INTERVALS[r.l]);
  srs[code] = r;
  persistSrs();
}

/* ---------- 狀態 ---------- */
const saved = JSON.parse(localStorage.getItem("twflip-settings") || "{}");
let settings = {
  mode: saved.mode || "c2n",
  th: saved.th || 3000,
  mkt: saved.mkt || "all",
  scope: saved.scope || "srs",
  size: saved.size === undefined ? 50 : saved.size,
};
const persist = () => localStorage.setItem("twflip-settings", JSON.stringify({
  mode: settings.mode, th: settings.th, mkt: settings.mkt,
  scope: settings.scope, size: settings.size,
}));

/* 有 20 日均量就用均量篩，沒有（歷史還不夠）才退回當日量 */
const AVG_DAYS = PAYLOAD.avg_days || 0;
const vol = s => AVG_DAYS ? (s.va ?? s.v) : s.v;

const base = () => STOCKS.filter(s =>
  vol(s) >= settings.th && (settings.mkt === "all" || s.m === settings.mkt));

function scopePool(list) {
  const t = today();
  if (settings.scope === "all") return shuffle(list.slice());
  if (settings.scope === "weak") return shuffle(list.filter(s => srs[s.c] && srs[s.c].l === 0));
  // 智慧排程：先清到期的（愈早到期愈前面），排完了才補沒學過的新卡
  const due = list.filter(s => srs[s.c] && srs[s.c].d <= t)
    .sort((a, b) => srs[a.c].d - srs[b.c].d);
  const fresh = shuffle(list.filter(s => !srs[s.c]));
  return [...due, ...fresh];
}

const pool = () => {
  const p = scopePool(base());
  return settings.size ? p.slice(0, settings.size) : p;
};

  document.querySelectorAll("#modes .mode-btn").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.mode === settings.mode));

    const t = Number(b.dataset.th);
    b.setAttribute("aria-pressed", t === settings.th);
    const n = STOCKS.filter(s => vol(s) >= t && (settings.mkt === "all" || s.m === settings.mkt)).length;
    b.querySelector(".cnt").textContent = ` ${n} 檔`;
  });

  const list = base(), t = today();
  const due = list.filter(s => srs[s.c] && srs[s.c].d <= t).length;
  const fresh = list.filter(s => !srs[s.c]).length;
  const weak = list.filter(s => srs[s.c] && srs[s.c].l === 0).length;
  const learning = list.filter(s => srs[s.c]).length;
  const counts = { srs: due + fresh, weak, all: list.length };

  document.querySelectorAll("#scopes .chip").forEach(b => {
    const sc = b.dataset.scope;
    b.setAttribute("aria-pressed", sc === settings.scope);
    b.querySelector(".cnt").textContent = ` ${counts[sc]}`;
    b.disabled = counts[sc] === 0 && sc !== settings.scope;
  });
  document.querySelectorAll("#sizes .chip").forEach(b =>
    b.setAttribute("aria-pressed", Number(b.dataset.size) === settings.size));

  const nextDue = list.map(s => srs[s.c]).filter(r => r && r.d > t).sort((a, b) => a.d - b.d)[0];
  $("scope-hint").innerHTML = settings.scope === "srs"
    ? `今天到期 <b>${due}</b> 張・沒學過 <b>${fresh}</b> 張・已排程 <b>${learning}</b> 張`
      + (due + fresh === 0 && nextDue ? `<br>今天沒有要複習的，下一批 ${daysUntil(nextDue.d)} 天後到期` : "")
    : settings.scope === "weak"
      ? (weak ? `曾經標記不熟、還沒重新記起來的 <b>${weak}</b> 張`
              : `目前沒有欠帳 👌　切到「智慧排程」繼續練`)
      : `忽略排程，這個門檻下的 <b>${list.length}</b> 張全部出題`;

  const n = pool().length;
  $("start").textContent = n ? `開始練習（${n} 檔）` : "目前沒有要練的";
  $("start").disabled = n === 0;
  persist();
}

$("modes").addEventListener("click", e => {
  const b = e.target.closest(".mode-btn");
  if (b) { settings.mode = b.dataset.mode; refreshSetup(); }
});
$("markets").addEventListener("click", e => {
  const b = e.target.closest(".chip");
  if (b) { settings.mkt = b.dataset.mkt; refreshSetup(); }
});
$("thresholds").addEventListener("click", e => {
  const b = e.target.closest(".chip");
  if (b) { settings.th = Number(b.dataset.th); refreshSetup(); }
});
$("scopes").addEventListener("click", e => {
  const b = e.target.closest(".chip");
  if (b && !b.disabled) { settings.scope = b.dataset.scope; refreshSetup(); }
});
$("sizes").addEventListener("click", e => {
  const b = e.target.closest(".chip");
  if (b) { settings.size = Number(b.dataset.size); refreshSetup(); }
});

/* ---------- 練習邏輯 ---------- */
let queue = [], total = 0, mastered = 0, flipped = false;
let attempts = {}, sessionMiss = new Set(), firstTry = 0;
let retryPool = [], sinceRetry = 0, current = null;   // 本輪不熟池、距上次穿插的新題數、目前這張

const MODE_LABEL = { c2n: "代號 → 名稱", n2c: "名稱 → 代號", mix: "混合出題" };

function deal(stocks) {
  queue = shuffle(stocks.map(s => ({
    s,
    dir: settings.mode === "mix" ? (Math.random() < .5 ? "c2n" : "n2c") : settings.mode,
  })));
  total = stocks.length; mastered = 0;
  attempts = {}; sessionMiss = new Set(); firstTry = 0;
  retryPool = []; sinceRetry = 0; current = null;
  $("play-mode").textContent = MODE_LABEL[settings.mode];
  show("scr-play");
  next();
}

function fillFaces(item) {
  const { s, dir } = item;
  const tag = `<span class="tag">${s.m}</span>`;
  const desc = s.d ? `<div class="a-desc">${s.d}</div>` : "";
  const volLabel = AVG_DAYS && s.va != null ? `${AVG_DAYS} 日均量` : "日成交";
  const meta = `${desc}<div class="a-meta">${s.i ? `<b>${s.i}</b><br>` : ""}${volLabel} <b>${fmtVol(vol(s))}</b>${s.p ? `　收盤 <b>${s.p}</b>` : ""}</div>`;
  if (dir === "c2n") {
    $("face-front").innerHTML = `${tag}<span class="ask">這是哪家公司？</span><div class="q-code mono">${s.c}</div>`;
    $("face-back").innerHTML = `${tag}<div class="a-name">${s.n}</div>${meta}`;
  } else {
    $("face-front").innerHTML = `${tag}<span class="ask">股號幾號？</span><div class="q-name">${s.n}</div>`;
    $("face-back").innerHTML = `${tag}<div class="a-code mono">${s.c}</div>${meta}`;
  }
}

function next() {
  if (!queue.length && !retryPool.length) { finish(); return; }
  // 出題節奏:每 3 張全新題穿插 1 張本輪不熟的;新題出完後輪流清不熟池
  if (retryPool.length && (sinceRetry >= 3 || !queue.length)) {
    current = retryPool.shift();
    sinceRetry = 0;
  } else {
    current = queue.shift();
    sinceRetry++;
  }
  flipped = false;
  $("card").classList.remove("flipped");
  fillFaces(current);
  $("btn-no").disabled = $("btn-yes").disabled = true;
  $("tap-hint").textContent = "點卡片翻面（空白鍵）";
  updateHead();
}

function updateHead() {
  $("play-score").textContent = `${mastered} / ${total}`;
  $("bar-fill").style.width = total ? (mastered / total * 100) + "%" : "0";
}

$("card").addEventListener("click", () => {
  flipped = !flipped;
  $("card").classList.toggle("flipped", flipped);
  if (flipped) {
    $("btn-no").disabled = $("btn-yes").disabled = false;
    $("tap-hint").textContent = "▲ 認得就往上熟一張，▼ 不熟稍後再出現（↑↓ 方向鍵）";
  }
});

$("btn-yes").addEventListener("click", () => {
  const c = current.s.c;
  attempts[c] = (attempts[c] || 0) + 1;
  if (attempts[c] === 1) firstTry++;
  mastered++;
  grade(c, true);          // 升一級，往後排更久才再出現
  next();
});

$("btn-no").addEventListener("click", () => {
  const item = current;
  const c = item.s.c;
  attempts[c] = (attempts[c] || 0) + 1;
  sessionMiss.add(c);
  grade(c, false);         // 掉回 0 級，明天以前還會再遇到
  if (settings.mode === "mix") item.dir = Math.random() < .5 ? "c2n" : "n2c";
  retryPool.push(item);   // 進本輪不熟池:之後每 3 張新題穿插 1 張再考
  next();
});

$("quit").addEventListener("click", finish);

function finish() {
  const practiced = Object.keys(attempts).length;
  $("done-title").textContent = (queue.length + retryPool.length) ? "提早收盤" : "本輪完成 🎉";
  $("st-total").textContent = practiced;
  $("st-first").textContent = firstTry;
  $("st-miss").textContent = sessionMiss.size;
  $("retry-miss").hidden = sessionMiss.size === 0;

  // 這輪練過的卡各自被排到什麼時候
  const buckets = new Map();
  Object.keys(attempts).forEach(c => {
    const r = srs[c];
    if (!r) return;
    const k = Math.max(0, daysUntil(r.d));
    buckets.set(k, (buckets.get(k) || 0) + 1);
  });
  $("done-hint").innerHTML = buckets.size
    ? "下次複習：" + [...buckets.entries()].sort((a, b) => a[0] - b[0])
      .map(([d, n]) => `${d === 0 ? "今天" : d === 1 ? "明天" : d + " 天後"} <b>${n}</b> 張`)
      .join("・")
    : "";

  queue = []; retryPool = [];
  show("scr-done");
}

$("retry-miss").addEventListener("click", () => {
  deal(STOCKS.filter(s => sessionMiss.has(s.c)));
});
$("back-setup").addEventListener("click", () => { refreshSetup(); show("scr-setup"); });
$("start").addEventListener("click", () => deal(pool()));

document.addEventListener("keydown", e => {
  if ($("scr-play").hidden) return;
  if (e.repeat) return;
  if (e.key === " " || e.code === "Space") {
    e.preventDefault();                       // 防捲動、防焦點按鈕被空白鍵重複觸發
    $("card").click();
  } else if (e.key === "ArrowUp" || e.key === "ArrowRight") {
    e.preventDefault();
    if (!$("btn-yes").disabled) $("btn-yes").click();
  } else if (e.key === "ArrowDown" || e.key === "ArrowLeft") {
    e.preventDefault();
    if (!$("btn-no").disabled) $("btn-no").click();
  }
});

function show(id) {
  ["scr-setup", "scr-play", "scr-done"].forEach(s => $(s).hidden = s !== id);
}

refreshSetup();
</script>
